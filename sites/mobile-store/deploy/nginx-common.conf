# /etc/nginx/snippets/mobile-store-common.conf — shared by the main domain and every store subdomain
server_tokens off;
access_log /var/log/nginx/mobile-store.access.log;
error_log  /var/log/nginx/mobile-store.error.log warn;

client_header_timeout 10s;
client_body_timeout   20s;
send_timeout          20s;
keepalive_timeout     30s;
client_max_body_size  1m;
client_body_buffer_size 1m;
large_client_header_buffers 4 8k;

limit_conn ms_conn 40;
limit_req  zone=ms_req burst=80 nodelay;
limit_req_status  429;
limit_conn_status 429;

if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE)$) { return 444; }
location ~ /\.(?!well-known) { return 444; }
location ~* \.(php|asp|aspx|jsp|cgi|env|git|sql|bak|ini|sh|ya?ml|conf)$ { return 444; }
location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

location ~ ^/(static|u)/ {
    proxy_pass http://127.0.0.1:3300;
    include /etc/nginx/snippets/mobile-store-proxy.conf;
    proxy_cache ms_cache;
    proxy_cache_key "$uri$is_args$args|$ms_enc";
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache $upstream_cache_status always;
}

location ^~ /auth/ {
    limit_req zone=ms_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:3300;
    include /etc/nginx/snippets/mobile-store-proxy.conf;
    proxy_read_timeout 20s;
}

location / {
    proxy_pass http://127.0.0.1:3300;
    include /etc/nginx/snippets/mobile-store-proxy.conf;
    proxy_read_timeout 30s;
}
