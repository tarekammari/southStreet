# /etc/nginx/sites-available/mobile-store — https://mobile.1zayd1.tech and https://<store>.mobile.1zayd1.tech
# Installed by deploy/install.sh. The HTTPS block for the main domain is added only once its certificate exists.

# Port 80: certificates + redirect. A store subdomain is redirected to HTTPS only once
# deploy/cert-worker.sh has issued its certificate (marker file); before that it is served over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name mobile.1zayd1.tech;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / {
        if (-f /var/www/ms-certs/mobile.1zayd1.tech) { return 301 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:3300;
        include /etc/nginx/snippets/mobile-store-proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name "~^(?<ms_store>[a-z0-9-]{2,30})\.mobile\.1zayd1\.tech$";
    if (-f /var/www/ms-certs/$host) { return 301 https://$host$request_uri; }
    include /etc/nginx/snippets/mobile-store-common.conf;
}

#__MAIN_HTTPS__

# Store subdomains: each store's own certificate, copied for nginx by deploy/cert-worker.sh.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name "~^(?<ms_store>[a-z0-9-]{2,30})\.mobile\.1zayd1\.tech$";
    ssl_certificate     /etc/nginx/ms-certs/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/ms-certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ms_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/snippets/mobile-store-common.conf;
}
