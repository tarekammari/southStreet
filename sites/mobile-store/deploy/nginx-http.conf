# /etc/nginx/conf.d/mobile-store-http.conf — http-level pieces for mobile.1zayd1.tech
limit_req_zone  $binary_remote_addr zone=ms_req:10m  rate=25r/s;
limit_req_zone  $binary_remote_addr zone=ms_auth:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=ms_conn:10m;

# Static files and product photos are cached by nginx (they have content-hash names).
proxy_cache_path /var/cache/nginx/mobile-store levels=1:2 keys_zone=ms_cache:20m max_size=2g inactive=30d use_temp_path=off;
map $http_accept_encoding $ms_enc { ~br br; ~gzip gzip; default ""; }
