server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mobile.1zayd1.tech;
    ssl_certificate     /etc/letsencrypt/live/mobile.1zayd1.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobile.1zayd1.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ms_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/snippets/mobile-store-common.conf;
}
