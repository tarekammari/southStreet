<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" rx="24" fill="url(#bg3)"/>

  <!-- Male Field Leader Figure -->
  <g>
    <!-- Head & Cap -->
    <ellipse cx="200" cy="155" rx="42" ry="48" fill="#d39e6a"/>
    <!-- Short Hair / Cap -->
    <path d="M 155 150 C 155 100, 245 100, 245 150 Z" fill="#1e293b"/>
    <!-- Mustache & Beard Trimmed -->
    <path d="M 170 175 Q 200 205 230 175 Q 220 195 200 198 Q 180 195 170 175 Z" fill="#334155"/>

    <!-- Green Field Operations Vest over Shirt -->
    <path d="M 100 320 L 135 220 Q 200 235 265 220 L 300 320 L 330 500 L 70 500 Z" fill="#047857"/>
    <!-- Inner White Shirt -->
    <path d="M 175 225 L 225 225 L 215 340 L 185 340 Z" fill="#ffffff"/>

    <!-- High Visibility Lanyard and Radio -->
    <path d="M 145 230 L 175 320 L 225 320 L 255 230" fill="none" stroke="#f59e0b" stroke-width="5"/>

    <!-- ID Card Badge -->
    <rect x="170" y="320" width="60" height="75" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="175" y="325" width="50" height="20" rx="3" fill="#047857"/>
    <text x="200" y="338" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">LEADER</text>
    <text x="200" y="365" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">قائد ميداني</text>
  </g>

  <!-- Name Banner -->
  <rect x="30" y="430" width="340" height="50" rx="14" fill="#064e3b" fill-opacity="0.95" stroke="url(#goldGrad3)" stroke-width="1.5"/>
  <text x="200" y="452" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">الأستاذ فاروق بوزيد</text>
  <text x="200" y="470" font-family="sans-serif" font-size="11" font-weight="500" fill="#a7f3d0" text-anchor="middle">مرشد ميداني وقائد مجموعات التفويج</text>
</svg>
