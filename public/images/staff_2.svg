<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgS2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="goldS2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" rx="24" fill="url(#bgS2)"/>

  <!-- Male Operations Lead Figure -->
  <g>
    <ellipse cx="200" cy="150" rx="44" ry="48" fill="#e0a96d"/>
    <path d="M 156 145 C 156 95, 244 95, 244 145 Z" fill="#1e293b"/>
    <!-- Headset for Operations -->
    <path d="M 150 150 C 150 105, 250 105, 250 150" fill="none" stroke="#f43f5e" stroke-width="4"/>
    <rect x="145" y="145" width="10" height="18" rx="3" fill="#f43f5e"/>
    <rect x="245" y="145" width="10" height="18" rx="3" fill="#f43f5e"/>

    <!-- Blue Operations Shirt -->
    <path d="M 90 340 L 135 240 Q 200 255 265 240 L 310 340 L 340 500 L 60 500 Z" fill="#0284c7"/>
    <path d="M 175 245 L 225 245 L 210 360 L 190 360 Z" fill="#ffffff"/>
  </g>

  <!-- Name Banner -->
  <rect x="30" y="430" width="340" height="50" rx="14" fill="#0c4a6e" fill-opacity="0.9" stroke="url(#goldS2)" stroke-width="1.5"/>
  <text x="200" y="452" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">السيد توفيق بوجمعة</text>
  <text x="200" y="470" font-family="sans-serif" font-size="11" font-weight="500" fill="#7dd3fc" text-anchor="middle">مدير العمليات اللوجستية والنقل</text>
</svg>
