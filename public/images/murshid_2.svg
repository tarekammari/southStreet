<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="gandoura" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" rx="24" fill="url(#bg2)"/>
  
  <!-- Mosque Dome Silhouette -->
  <path d="M 200 60 C 130 140, 100 200, 100 320 L 300 320 C 300 200, 270 140, 200 60 Z" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Male Scholar Figure -->
  <g>
    <!-- White Turban / Amama -->
    <ellipse cx="200" cy="140" rx="55" ry="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="200" cy="130" rx="45" ry="18" fill="#f8fafc"/>

    <!-- Face Tone -->
    <path d="M 160 150 C 160 200, 240 200, 240 150 Z" fill="#e0a96d"/>
    <!-- Neat Beard -->
    <path d="M 160 160 Q 200 225 240 160 Q 230 215 200 220 Q 170 215 160 160 Z" fill="#334155"/>
    
    <!-- Eyes & Gentle Smile -->
    <path d="M 180 165 Q 187 160 193 165" fill="none" stroke="#1e293b" stroke-width="2"/>
    <path d="M 207 165 Q 213 160 220 165" fill="none" stroke="#1e293b" stroke-width="2"/>
    <path d="M 188 185 Q 200 195 212 185" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>

    <!-- Traditional Gandoura Clothing -->
    <path d="M 100 320 L 140 230 Q 200 245 260 230 L 300 320 L 330 500 L 70 500 Z" fill="url(#gandoura)"/>
    <!-- Gold Embroidery Collar -->
    <path d="M 170 235 Q 200 280 230 235 L 240 360 L 160 360 Z" fill="none" stroke="#d97706" stroke-width="4"/>

    <!-- Green Guide Badge -->
    <rect x="175" y="320" width="50" height="70" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="180" y="325" width="40" height="18" rx="3" fill="#047857"/>
    <text x="200" y="337" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">SOUTH STREET</text>
    <text x="200" y="365" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1e293b" text-anchor="middle">المدينة</text>
  </g>

  <!-- Name Banner -->
  <rect x="30" y="430" width="340" height="50" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="url(#goldGrad2)" stroke-width="1.5"/>
  <text x="200" y="452" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">الشيخ محمد الطيب</text>
  <text x="200" y="470" font-family="sans-serif" font-size="11" font-weight="500" fill="#c7d2fe" text-anchor="middle">مرشد المناسك والمزارات — المدينة المنورة</text>
</svg>
