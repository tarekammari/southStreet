    <path d="M 145 240 L 175 320 L 225 320 L 255 240" fill="none" stroke="#059669" stroke-width="5"/>
    <rect x="175" y="320" width="50" height="70" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect x="180" y="325" width="40" height="18" rx="3" fill="#047857"/>
    <text x="200" y="337" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">SOUTH STREET</text>
