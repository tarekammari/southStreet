  <rect x="30" y="430" width="340" height="50" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="url(#goldGrad4)" stroke-width="1.5"/>
  <text x="200" y="452" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">الشيخ ياسين العلي</text>
  <text x="200" y="470" font-family="sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">مرشد التوجيه الروحي والدعم المباشر</text>
