<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgS1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldS1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" rx="24" fill="url(#bgS1)"/>

  <!-- Male Executive Suit Figure -->
  <g>
    <!-- Head & Hair -->
    <ellipse cx="200" cy="150" rx="45" ry="50" fill="#d39e6a"/>
    <path d="M 155 140 C 155 90, 245 90, 245 140 Z" fill="#0f172a"/>
    <!-- Neat Glasses & Beard -->
    <rect x="170" y="145" width="22" height="14" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <rect x="208" y="145" width="22" height="14" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="192" y1="152" x2="208" y2="152" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 170 175 Q 200 205 230 175 Q 220 195 200 198 Q 180 195 170 175 Z" fill="#1e293b"/>

    <!-- Dark Executive Suit -->
    <path d="M 90 340 L 135 240 Q 200 255 265 240 L 310 340 L 340 500 L 60 500 Z" fill="#0f172a"/>
    <!-- White Shirt & Gold Tie -->
    <path d="M 175 245 L 225 245 L 210 360 L 190 360 Z" fill="#ffffff"/>
    <polygon points="195,250 205,250 208,340 200,355 192,340" fill="#ca8a04"/>
  </g>

  <!-- Name Banner -->
  <rect x="30" y="430" width="340" height="50" rx="14" fill="#020617" fill-opacity="0.9" stroke="url(#goldS1)" stroke-width="1.5"/>
  <text x="200" y="452" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">الأستاذ أحمد المنصوري</text>
  <text x="200" y="470" font-family="sans-serif" font-size="11" font-weight="500" fill="#38bdf8" text-anchor="middle">المدير العام لوكالة ساوث ستريت</text>
</svg>
