<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden}
body{font-family:"Segoe UI",Tahoma,sans-serif;background:radial-gradient(circle at 78% 50%,#2350b8 0,#163a8f 38%,#0b1f55 100%);color:#fff;position:relative}
.ring{position:absolute;right:62px;top:50px;width:400px;height:400px;border-radius:50%;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.35);display:grid;place-items:center}
.ring img{width:370px;height:370px}
.txt{position:absolute;left:64px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center;gap:14px}
h1{font-size:76px;font-weight:800;letter-spacing:-1px;line-height:1}
h1 span{color:#f2c14e}
.ar{font-size:34px;font-weight:700;direction:rtl;text-align:left;color:#f6e7bd}
.en{font-size:24px;color:#cfdaf5}
.pills{display:flex;gap:10px;margin-top:8px}
.pills b{font-size:19px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:8px 16px;border-radius:999px}
</style></head><body>
<div class="txt"><h1>R.H <span>Connect</span></h1>
<div class="ar">رسائل ومكالمات مع وكالتك</div>
<div class="en">Messages &amp; calls with R.H Tours</div>
<div class="pills"><b>💬 Chat</b><b>📞 Calls</b><b>🔔 Alerts</b></div></div>
<div class="ring"><img src="icon-512.png"></div>
</body></html>
